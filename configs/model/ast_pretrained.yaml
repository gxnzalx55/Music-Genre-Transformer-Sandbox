type: "pretrained"
name: "AST-HuggingFace"

hf_model_id: "MIT/ast-finetuned-audioset-10-10-0.4593"
num_classes: null       # overridden at runtime from dataset config

# ── Fine-tuning strategy ──────────────────────────────────────────────────────
