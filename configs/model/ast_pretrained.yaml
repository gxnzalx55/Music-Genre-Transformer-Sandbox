type: "pretrained"
name: "AST-HuggingFace"

hf_model_id: "MIT/ast-finetuned-audioset-10-10-0.4593"
num_classes: null       # overridden at runtime from dataset config

# ── Fine-tuning strategy ──────────────────────────────────────────────────────
freeze_layers: 0        # freeze first N encoder blocks (0 = train everything)
lr_multiplier_encoder: 0.1   # encoder gets 0.1× base LR; head gets 1.0×

# ── Replacement head ─────────────────────────────────────────────────────────
head_dropout: 0.1

# ── Input scaling ─────────────────────────────────────────────────────────────
# The HF AST was pretrained on (x - mean) / (2 * std), i.e. inputs with std ≈ 0.5.
# Our data is z-scored (std ≈ 1), so scale by 0.5 to match. Use 1.0 for the old behaviour.
input_scale: 0.5
